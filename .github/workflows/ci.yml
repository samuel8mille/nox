name: CI

on:
  push:
    branches: [main, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancela execuções anteriores em andamento no mesmo branch/PR — evita
# gastar minutos de CI rodando uma versão já obsoleta do código.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pre-flight: decide se vale a pena rodar a pipeline pesada. Mudanças que
  # não tocam em código (ex.: só docs) pulam os quality gates e o build.
  pre-flight-check:
    name: Pre-flight Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_continue: ${{ steps.should_continue.outputs.should_continue }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            src:
              - 'shared/**'
              - 'desktopApp/**'
              - 'androidApp/**'
              - 'iosApp/**'
              - '**/*.gradle.kts'
              - 'gradle/libs.versions.toml'
              - 'detekt.yml'
              - '.editorconfig'
              - '.github/workflows/**'
      - name: Decide whether to continue
        id: should_continue
        run: |
          if [[ "${{ steps.changes.outputs.src }}" == "true" ]]; then
            echo "should_continue=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Sem mudanças relevantes — pulando quality gates e build" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  code-style:
    name: Code Style (ktlint)
    runs-on: ubuntu-latest
    needs: [pre-flight-check]
    if: needs.pre-flight-check.outputs.should_continue == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck

  static-analysis:
    name: Static Analysis (detekt)
    runs-on: ubuntu-latest
    needs: [pre-flight-check]
    if: needs.pre-flight-check.outputs.should_continue == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew detekt

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [pre-flight-check]
    if: needs.pre-flight-check.outputs.should_continue == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:jvmTest
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: test-report
          path: shared/build/reports/tests/
          retention-days: 7

  dependency-review:
    name: Dependency Review (CVE)
    runs-on: ubuntu-latest
    needs: [pre-flight-check]
    if: needs.pre-flight-check.outputs.should_continue == 'true' && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # Build só roda quando todos os quality gates e testes passam.
  build:
    name: Build Desktop
    needs: [pre-flight-check, code-style, static-analysis, unit-tests]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.pre-flight-check.outputs.should_continue == 'true' &&
      needs.code-style.result == 'success' &&
      needs.static-analysis.result == 'success' &&
      needs.unit-tests.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktopApp:compileKotlin
