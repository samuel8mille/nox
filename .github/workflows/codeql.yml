name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Toda segunda às 4h UTC — varredura semanal completa.
    - cron: '0 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # O CodeQL instrumenta a compilação pelo tracer; com o cache do Gradle
          # o build vira UP-TO-DATE e nenhum .kt é recompilado, resultando em
          # "no source code seen during build". Desativar o cache força a build
          # real que o CodeQL precisa.
          cache-disabled: true

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Build
        run: ./gradlew :desktopApp:compileKotlin --no-build-cache --rerun-tasks

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:java-kotlin'
