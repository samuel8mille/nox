@keyframes nox-speak{0%,100%{width:calc(var(--size)*.11);height:calc(var(--size)*.024)}10%{width:calc(var(--size)*.15);height:calc(var(--size)*.075)}20%{width:calc(var(--size)*.12);height:calc(var(--size)*.035)}30%{width:calc(var(--size)*.10);height:calc(var(--size)*.085)}42%{width:calc(var(--size)*.16);height:calc(var(--size)*.04)}52%{width:calc(var(--size)*.11);height:calc(var(--size)*.024)}62%{width:calc(var(--size)*.14);height:calc(var(--size)*.09)}72%{width:calc(var(--size)*.13);height:calc(var(--size)*.05)}82%{width:calc(var(--size)*.09);height:calc(var(--size)*.07)}92%{width:calc(var(--size)*.15);height:calc(var(--size)*.03)}}

@keyframes nox-glow-talk{0%,100%{opacity:.6}15%{opacity:.95}30%{opacity:.7}48%{opacity:1}62%{opacity:.65}80%{opacity:.9}}
@keyframes nox-voice{0%,100%{opacity:0}12%{opacity:.4}24%{opacity:.12}38%{opacity:.35}52%{opacity:.05}64%{opacity:.45}78%{opacity:.15}90%{opacity:.3}}
@keyframes nox-wave-soft{0%{transform:scale(1);opacity:.35}100%{transform:scale(1.4);opacity:0}}
.orb-voice{position:absolute;left:25%;top:35%;width:50%;height:50%;border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--c1) 35%,transparent 70%);mix-blend-mode:screen;filter:blur(calc(var(--size)*.05));opacity:0;pointer-events:none}
